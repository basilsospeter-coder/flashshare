name: flash_sender
description: "A fast local file sharing app."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.10.5+9
  permission_handler: ^11.3.1
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.6

  # Dependencies for QR code generation and reliable scanning
  qr_flutter: ^4.1.0
  ai_barcode_scanner: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
