name: Build FlashShare APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Export FLUTTER_ROOT
        run: |
          FLUTTER_BIN="$(which flutter)"
          if [ -z "$FLUTTER_BIN" ]; then
            echo "flutter not found on PATH" >&2
            exit 1
          fi
          FLUTTER_ROOT="$(dirname "$(dirname "$FLUTTER_BIN")")"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> $GITHUB_ENV
          echo "Successfully set FLUTTER_ROOT=$FLUTTER_ROOT"

      - name: Create android/local.properties
        run: |
          mkdir -p android
          echo "flutter.sdk=${FLUTTER_ROOT}" > android/local.properties
          echo "sdk.dir=${ANDROID_HOME:-$HOME/Android/Sdk}" >> android/local.properties

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            cd android
            gradle wrapper --gradle-version 8.3
            chmod +x gradlew
          else
            echo "Android gradlew already present"
          fi

      - name: Create Missing Asset Folders
        run: |
          mkdir -p assets/icons
          mkdir -p assets/images

      - name: Force compileSdk 36 Globally
        run: |
          mkdir -p ~/.gradle
          echo "allprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android { compileSdkVersion 36 } } } }" > ~/.gradle/init.gradle

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons -v

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashshare-release-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/**/*.apk
