name: Build FlashShare APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Create Missing Asset Folders
        run: |
          mkdir -p assets/icons
          mkdir -p assets/images

      - name: Recreate Android Project Wrapper
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.flashshare

      - name: Get Dependencies
        run: flutter pub get

      - name: Update Android Compile SDK to 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle

      - name: Add Camera Permissions to Manifest
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-feature android:name="android.hardware.camera"/>' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashshare-release-apk
          path: build/app/outputs/flutter-apk/*.apk
