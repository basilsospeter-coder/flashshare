name: Build FlashShare APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Create Missing Asset Folders
        run: |
          mkdir -p assets/icons
          mkdir -p assets/images

      - name: Get Dependencies
        run: flutter pub get

      - name: Force compileSdk 36 Globally
        run: |
          mkdir -p ~/.gradle
          echo "allprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android { compileSdkVersion 36 } } } }" > ~/.gradle/init.gradle

      - name: Fix Gradle Wrapper Line Endings & Permissions
        run: |
          for f in gradlew android/gradlew gradle/wrapper/gradle-wrapper.sh; do
            if [ -f "$f" ]; then
              sed -i 's/\r$//' "$f"
              chmod +x "$f"
            fi
          done

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashshare-release-apk
          path: build/app/outputs/flutter-apk/*.apk
