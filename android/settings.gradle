pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def file = new File(rootDir, 'local.properties')
        if (file.exists()) {
            file.withReader('UTF-8') { reader -> properties.load(reader) }
        }
        def sdkPath = properties.getProperty('flutter.sdk')
        if (sdkPath == null || sdkPath.trim() == '' || sdkPath == 'null') {
            sdkPath = System.getenv("FLUTTER_ROOT")
        }
        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.0" apply false
}

rootProject.name = "flashshare"
include ':app'